<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holding Topology Stage</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: manipulation;
    }
    #stage {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      background: #000;
    }
    .stage-court {
      width: min(100vw, 100vh * 9 / 16 * 0.92);
      height: auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #000;
      /* Vertical Instagram frame feel: square court inside 9:16. */
      max-height: 92vh;
      aspect-ratio: 1 / 1;
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <script type="module" src="./js/stage.js"></script>
</body>
</html>
